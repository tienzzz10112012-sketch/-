<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỒ SƠ TẬP TIN T2.5 - HỆ THỐNG CẢNH BÁO</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #008080; /* Màu nền Windows 95/98 đặc trưng */
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* KHUNG CHÍNH NỀN HỒ SƠ */
        .main-background {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }

        .start-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            color: #000;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .start-btn:active {
            border-color: #404040 #ffffff #ffffff #404040;
        }

        /* KIỂU DÁNG CỬA SỔ ERROR THEO HÌNH ẢNH MẪU */
        .error-window {
            position: absolute;
            width: 300px;
            height: 170px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        /* THANH TIÊU ĐỀ CỬA SỔ (MÀU XANH DƯƠNG CHUẨN WINDOWS) */
        .error-titlebar {
            height: 24px;
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 0 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .error-close-btn {
            width: 16px;
            height: 14px;
            background: #c0c0c0;
            border: 1px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            color: #000;
            font-size: 10px;
            line-height: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }

        /* NỘI DUNG BÊN TRONG CỬA SỔ ERROR */
        .error-body {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #c0c0c0;
        }

        .error-content-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* BIỂU TƯỢNG CẢNH BÁO TAM GIÁC VÀNG */
        .warning-icon {
            width: 36px;
            height: 36px;
            background: #ffcc00;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .warning-icon::after {
            content: '!';
            color: #000;
            font-weight: 900;
            font-size: 20px;
            margin-top: 4px;
        }

        .error-text {
            font-size: 13px;
            color: #000;
            font-weight: bold;
        }

        /* NÚT OK CỔ ĐIỂN */
        .error-ok-btn {
            width: 75px;
            height: 23px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .error-ok-btn:active {
            border-color: #404040 #ffffff #ffffff #404040;
        }
    </style>
</head>
<body>

    <div class="main-background">
        <h1>HỒ SƠ LƯU TRỮ T2.5</h1>
        <p>Cảnh báo: Dữ liệu bị rò rỉ từ khu vực trần nhà.</p>
        <button class="start-btn" onclick="triggerErrorCascade()">MỞ TẬP TIN HỒ SƠ</button>
    </div>

    <!-- NƠI CHỨA CÁC CỬA SỔ ERROR -->
    <div id="errorContainer"></div>

    <script>
        let zIndexCounter = 100; // Số càng lớn nằm càng đằng trước

        function triggerErrorCascade() {
            const container = document.getElementById('errorContainer');
            container.innerHTML = ''; // Xóa các error cũ nếu có

            // Tọa độ bắt đầu (góc trên bên trái)
            let startX = Math.max(20, window.innerWidth / 2 - 250);
            let startY = Math.max(20, window.innerHeight / 2 - 200);

            const totalErrors = 10; // Số lượng cửa sổ xếp tầng giống ảnh
            const stepX = 22; // Khoảng lệch ngang giữa các cửa sổ
            const stepY = 22; // Khoảng lệch dọc giữa các cửa sổ

            for (let i = 0; i < totalErrors; i++) {
                setTimeout(() => {
                    createErrorWindow(
                        startX + (i * stepX), 
                        startY + (i * stepY), 
                        i === totalErrors - 1 // Cửa sổ cuối cùng là Critical Error có nút OK
                    );
                }, i * 120); // Xuất hiện nối tiếp nhau 120ms
            }
        }

        function createErrorWindow(x, y, isLast) {
            const container = document.getElementById('errorContainer');
            const win = document.createElement('div');
            win.className = 'error-window';
            
            // Đảm bảo cửa sổ tạo sau có zIndex cao hơn -> nằm đằng trước
            zIndexCounter++;
            win.style.zIndex = zIndexCounter;
            
            // Vị trí cố định tạo hiệu ứng thác nước (Cascade)
            win.style.left = x + 'px';
            win.style.top = y + 'px';

            win.innerHTML = `
                <div class="error-titlebar">
                    <span>Error</span>
                    <div class="error-close-btn" onclick="this.parentElement.parentElement.remove()">✕</div>
                </div>
                <div class="error-body">
                    <div class="error-content-wrapper">
                        <div class="warning-icon"></div>
                        <div class="error-text">${isLast ? 'Critical error' : 'Fatal Exception 0E'}</div>
                    </div>
                    ${isLast ? '<button class="error-ok-btn" onclick="finishErrorSequence()">OK</button>' : ''}
                </div>
            `;

            container.appendChild(win);
            playErrorSound();
        }

        // Âm thanh Beep báo lỗi cổ điển
        function playErrorSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function finishErrorSequence() {
            alert("Mật mã tiếp theo đã được giải phóng: log_9a3_trannha");
            window.location.href = "log_9a3_trannha.html";
        }
    </script>
</body>
</html>
